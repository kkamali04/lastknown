name: Native release candidates
# Manual validation only. This never creates a release, tag, or public repository.
on:
  workflow_dispatch:
  workflow_call:
permissions:
  contents: read
concurrency:
  group: native-release-candidates-${{ github.ref }}
  cancel-in-progress: false
jobs:
  native:
    strategy:
      fail-fast: false
      max-parallel: 2
      matrix:
        include:
          - runner: windows-2022
            target: x86_64-pc-windows-msvc
            name: windows-x64
            binary: recall.exe
          - runner: ubuntu-24.04
            target: x86_64-unknown-linux-gnu
            name: linux-x64
            binary: recall
          - runner: ubuntu-24.04-arm
            target: aarch64-unknown-linux-gnu
            name: linux-arm64
            binary: recall
          - runner: macos-15
            target: aarch64-apple-darwin
            name: macos-arm64
            binary: recall
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 75
    env:
      CARGO_BUILD_JOBS: 2
      RUSTFLAGS: --remap-path-prefix=${{ github.workspace }}=/build/work
      TERM: dumb
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: "1.96.0"
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install ripgrep (Linux)
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y ripgrep
      - name: Install ripgrep (macOS)
        if: runner.os == 'macOS'
        run: brew install ripgrep
      - name: Install ripgrep (Windows)
        if: runner.os == 'Windows'
        run: choco install ripgrep -y --no-progress
      - name: Rust tests and native binary (default features)
        shell: bash
        run: |
          set -euo pipefail
          cargo test --release --locked -- --test-threads=2
          cargo build --release --locked
      - name: Python tests
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install -r mcp/requirements.txt pytest
          python -m pytest ingest mcp/test_recall_mcp.py scripts/test_install_deps.py scripts/test_clean_install_smoke.py scripts/test_ort_package.py bench/scripts/test_beir_compare.py -q
      - name: Target-specific Rust licenses
        shell: bash
        run: |
          set -euo pipefail
          cargo fetch --locked --target ${{ matrix.target }}
          python scripts/bundle_licenses.py --target ${{ matrix.target }} --out "${{ runner.temp }}/native-licenses"
      - name: Package and verify archive readback
        run: python scripts/package_candidate.py --target ${{ matrix.target }} --binary target/release/${{ matrix.binary }} --licenses "${{ runner.temp }}/native-licenses" --out "${{ runner.temp }}/native-package"
      - name: Fresh prebuilt install, BGE, MCP, privacy, UI, daemon, freshness
        run: python scripts/verify_platform_candidate.py --package-dir "${{ runner.temp }}/native-package/lastknown-${{ matrix.name }}" --home "${{ runner.temp }}/native-test-home" --results "${{ runner.temp }}/native-evidence/result.json"
      - name: Upload validated candidate
        uses: actions/upload-artifact@v4
        with:
          name: lastknown-${{ matrix.name }}
          path: |
            ${{ runner.temp }}/native-package/*.zip
            ${{ runner.temp }}/native-package/*.tar.gz
            ${{ runner.temp }}/native-package/SHA256SUMS.txt
          if-no-files-found: error
          retention-days: 14
      - name: Upload test evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: evidence-${{ matrix.name }}
          path: ${{ runner.temp }}/native-evidence/
          if-no-files-found: ignore
          retention-days: 14
  source:
    needs: native
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Export committed source
        run: |
          git archive --format=tar.gz --prefix=lastknown-source/ --output=lastknown-source.tar.gz HEAD
          sha256sum lastknown-source.tar.gz > SHA256SUMS.txt
      - uses: actions/upload-artifact@v4
        with:
          name: lastknown-source
          path: |
            lastknown-source.tar.gz
            SHA256SUMS.txt
          if-no-files-found: error
          retention-days: 14
